<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f3f4f6;
            color: #333;
            min-height: 100vh;
        }

        .navbar {
            background-color: #1e3a8a;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .nav-brand {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 1.5rem;
        }

        .nav-links a:hover {
            opacity: 0.8;
        }

        .container {
            max-width: 900px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            text-align: center;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 3rem;
        }

        .dash-card {
            background: white;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dash-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        .dash-card h2 {
            font-size: 1.5rem;
            color: #1e3a8a;
            margin-bottom: 0.5rem;
        }

        .dash-card p {
            color: #6b7280;
            font-size: 0.95rem;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 600px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand">Admin Portal</div>
        <div class="nav-links">
            <a href="/admin_dashboard">Dashboard</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>
    <div class="container">
        <h1>Welcome, {{ session['name'] }}</h1>
        <p style="color: #6b7280; margin-top: 0.5rem;">Manage project submissions and calculate system analytics.</p>

        <div class="dashboard-grid">
            <a href="/view_titles" class="dash-card">
                <div class="icon">📄</div>
                <h2>View Submitted Titles</h2>
                <p>Review all student submissions and similarity scores.</p>
            </a>
            <a href="/reports" class="dash-card">
                <div class="icon">📊</div>
                <h2>View Reports</h2>
                <p>Analyze metrics for unique, moderate, and duplicate titles.</p>
            </a>
        </div>
    </div>
</body>

</html>
